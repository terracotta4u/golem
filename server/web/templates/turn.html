{{define "turn"}}
<div class="message user my-6">
  <p class="m-0 py-2 px-3">{{.User}}</p>
</div>
<div
  class="message assistant"
  id="turn-{{.ID}}"
  hx-sse:connect="/turns/{{.ID}}"
  hx-sse:close="close"
  hx-swap="none"
>
  <div class="tool-log stack gap-2 mb-2"></div>
  <div class="reply"><p>Thinking...</p></div>
</div>
{{end}}
