{{define "conversation"}}
{{template "layout-start" .}}
<main class="container stack grow">
  <section id="messages" class="stack gap-3 grow">
    {{if not .Messages}}
    <p class="empty-chat">Ask Golem anything to get started</p>
    {{end}}
    {{range .Messages}}
      {{if and (or (eq .Role "user") (eq .Role "assistant")) .Content}}
        <div class="message {{.Role}}{{if eq .Role "user"}} my-6{{end}}">
          <p>{{.Content}}</p>
        </div>
      {{end}}
    {{end}}
  </section>
  <div class="composer-spacer" aria-hidden="true"></div>
  <form
    class="composer shadow-lg"
    method="post"
    action="/conversations/{{.ID}}/turns"
    hx-post="/conversations/{{.ID}}/turns"
    hx-target="#messages"
    hx-swap="beforeend scroll:bottom scrollTarget:.workspace"
    hx-push-url="/conversations/{{.ID}}"
    hx-on::after:request="this.reset(); this.querySelector('textarea').focus()"
  >
    <textarea
      class="p-3"
      name="message"
      rows="3"
      required
      placeholder="How can I help you today?"
      autofocus
      hx-on:keydown="if (event.key !== 'Enter' || event.shiftKey || event.isComposing || event.repeat) return; event.preventDefault(); this.form.requestSubmit()"
    ></textarea>
    <div class="composer-bar">
      <button class="m-0" type="submit">Send</button>
    </div>
  </form>
</main>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const workspace = document.querySelector(".workspace");
  const composer = document.querySelector(".composer");
  const sync = () => {
    if (composer) {
      document.documentElement.style.setProperty("--composer-height", composer.offsetHeight + "px");
    }
  };
  if (composer) new ResizeObserver(sync).observe(composer);
  sync();
  requestAnimationFrame(() => {
    if (workspace) workspace.scrollTop = workspace.scrollHeight;
  });
});
</script>
{{template "layout-end" .}}
{{end}}
