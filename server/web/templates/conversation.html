{{define "conversation"}}
{{template "layout-start" .}}
<main class="stack grow">
  <section id="messages" class="stack gap-3 grow pb-40">
    {{range .Messages}}
      {{if and (or (eq .Role "user") (eq .Role "assistant")) .Content}}
        <div class="message {{.Role}}{{if eq .Role "user"}} my-6{{end}}">
          <p>{{.Content}}</p>
        </div>
      {{end}}
    {{end}}
  </section>
  <form
    class="composer"
    method="post"
    action="/conversations/{{.ID}}/turns"
    hx-post="/conversations/{{.ID}}/turns"
    hx-target="#messages"
    hx-swap="beforeend"
    hx-on::after:request="this.reset()"
  >
    <textarea
      class="p-3"
      name="message"
      rows="3"
      required
      placeholder="Message"
      hx-on:keydown="if (event.key !== 'Enter' || event.shiftKey || event.isComposing || event.repeat) return; event.preventDefault(); this.form.requestSubmit()"
    ></textarea>
    <div class="composer-bar">
      <button class="m-0" type="submit">Send</button>
    </div>
  </form>
</main>
{{template "layout-end" .}}
{{end}}
