{{define "conversation"}}
{{template "layout-start" .}}
<header>
  <a href="/">All conversations</a>
</header>
<main class="stack grow">
  <section id="messages" class="stack gap-3 grow">
    {{range .Messages}}
      {{if and (or (eq .Role "user") (eq .Role "assistant")) .Content}}
        <div class="message {{.Role}}">
          <p>{{.Content}}</p>
        </div>
      {{end}}
    {{end}}
  </section>
  <form
    class="composer cluster gap-2 items-end"
    method="post"
    action="/conversations/{{.ID}}/turns"
    hx-post="/conversations/{{.ID}}/turns"
    hx-target="#messages"
    hx-swap="beforeend"
    hx-on::after:request="this.reset()"
  >
    <textarea
      name="message"
      rows="3"
      required
      placeholder="Message"
      hx-on:keydown="if (event.key !== 'Enter' || event.shiftKey || event.isComposing || event.repeat) return; event.preventDefault(); this.form.requestSubmit()"
    ></textarea>
    <button type="submit">Send</button>
  </form>
</main>
{{template "layout-end" .}}
{{end}}
