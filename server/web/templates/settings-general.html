{{define "settings-general"}}
{{template "layout-start" .}}
<nav class="subnav cluster gap-0">
  <div class="subnav-heading stack gap-0 py-3 px-5">
    <nav class="breadcrumbs type-label" aria-label="Breadcrumb">
      <a href="/settings">Settings</a>
    </nav>
    <h1 class="type-display">General</h1>
  </div>
</nav>
<main class="container container-md stack grow">
  <section class="panel p-6">
    <form class="stack gap-5" method="post" action="/settings/general">
      <div class="stack gap-2">
        <h2 class="type-heading">Default model</h2>
        <p class="field-hint">Used for chat and other complex tasks.</p>
      </div>
      <div class="field stack gap-2">
        <label for="default_provider">Provider</label>
        <select id="default_provider" name="default_provider">
          <option value="openrouter"{{if eq .DefaultProvider "openrouter"}} selected{{end}}>OpenRouter</option>
        </select>
      </div>
      <div class="field stack gap-2">
        <label for="default_model">Model</label>
        <input id="default_model" name="default_model" type="text" required value="{{.DefaultModel}}">
      </div>
      <div class="stack gap-2">
        <h2 class="type-heading">Fast model</h2>
        <p class="field-hint">Used for lightweight tasks.</p>
      </div>
      <div class="field stack gap-2">
        <label for="fast_provider">Provider</label>
        <select id="fast_provider" name="fast_provider">
          <option value="openrouter"{{if eq .FastProvider "openrouter"}} selected{{end}}>OpenRouter</option>
        </select>
      </div>
      <div class="field stack gap-2">
        <label for="fast_model">Model</label>
        <input id="fast_model" name="fast_model" type="text" required value="{{.FastModel}}">
      </div>
      <div class="field stack gap-2">
        <label for="max_tool_rounds">Max tool rounds</label>
        <p class="field-hint">0 means no limit.</p>
        <input id="max_tool_rounds" name="max_tool_rounds" type="number" min="0" step="1" value="{{.MaxToolRounds}}">
      </div>
      <button type="submit" class="btn-accent">Save</button>
    </form>
  </section>
</main>
{{template "layout-end" .}}
{{end}}
