{{define "extensions"}}
{{template "layout-start" .}}
<main class="container stack grow">
  <h1>Extensions</h1>
  <details class="add-menu">
    <summary>Add extension</summary>
    <div class="add-menu-list stack gap-0">
      <a class="px-3 py-2" href="/settings/extensions/add?from=url">URL</a>
      <a class="px-3 py-2" href="/settings/extensions/add?from=archive">Local archive</a>
    </div>
  </details>
  {{if .Extensions}}
  <ul class="stack gap-3">
    {{range .Extensions}}
    <li class="stack gap-1">
      <a href="/settings/extensions/{{.Name}}"><strong>{{.Name}}</strong></a>
      <span>{{.Version}}</span>
      {{if .Source}}<span class="field-hint">{{.Source}}</span>{{end}}
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="field-hint">No extensions</p>
  {{end}}
</main>
{{template "layout-end" .}}
{{end}}
